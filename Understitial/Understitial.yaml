adType:
  text: Werbemittel Typ
  fieldType: combobox
  type: string
  store:
    img: Bild
    html: HTML
imgFile:
  text: Bilddatei hochladen
  fieldType: upload
  type: file
  showIf:
    placeholderName: adType
    values: [img]
adUrl:
  text: Hostinglink (URL)
  fieldType: textfield
  type: string
  showIf:
    placeholderName: adType
    values: [html]
responsive:
  text: responsive Ausspielung
  description: Passt Breite/Höhe/Verhältnis des Werbemittel-Containers and das jeweilige Endgerät an. Heißt das Werbemittel muss auch für responsive Ausspielung ausgelegt sein. (Bei nicht-responsiver Ausspielung wird das Verhältnis mit 1:2 angenommen)
  fieldType: checkbox
  type: boolean
  default: false
politischeAnzeige:
  text: politische Anzeige
  fieldType: checkbox
  type: boolean
  group: "Politische Anzeige"
  default: false
sponsorName:
  text: Sponsor
  fieldType: textfield
  type: string
  group: "Politische Anzeige"
